# Reproducible research infrastructure for EIBench.
# All images are pinned to exact versions.
#
# Default (recommended): `make up` / `docker compose up -d qdrant` starts
# ONLY Qdrant. Ollama is installed and run NATIVELY instead (see
# setup.sh / `make bootstrap` / `make ollama-pull`) — simpler GPU access,
# and it avoids a port-11434 clash with the `ollama` service below, which
# binds the same host port. Run "make up" (not plain "docker compose up -d")
# so Qdrant-only is the default; only use the profile below if you
# specifically want Ollama running in Docker instead of natively.
#
# Alternative: the pinned `ollama/ollama:0.2.8` container below, gated
# behind the "docker-ollama" Compose profile so it never starts by
# accident alongside a native Ollama install:
#   docker compose --profile docker-ollama up -d   (== `make up-docker-ollama`)
#   docker exec eiger-ollama ollama pull llama3.1:8b

services:

  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: eiger-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.2.8
    container_name: eiger-ollama
    profiles: ["docker-ollama"]  # opt-in only — see the header comment above
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull models after container starts:
    # docker exec eiger-ollama ollama pull llama3.1:8b
    # docker exec eiger-ollama ollama pull mistral:7b

volumes:
  qdrant_storage:
  ollama_data:
