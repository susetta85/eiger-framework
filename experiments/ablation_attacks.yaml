# EIBench Ablation Study — all 6 mechanical attack types at poison_rate=0.3
# Run with: python -m eiger run experiments/ablation_attacks.yaml
#
# This is an ENGINEERING ABLATION, not a paper-facing experiment: it
# includes attribution_switch (M03) and cherry_picking (M05), both of
# which are explicitly ABSENT from the EIB paper's published benchmark
# corpus (Corpus_claim_RAG_Mistral_output_v3.xlsx) for ethical/reputational
# reasons stated in the paper itself (§6.0.2) — see
# eiger/attacks/attribution.py and eiger/attacks/cherry_picking.py's own
# docstrings. allow_non_benchmark_attacks: true is required below or
# CorpusBuilder raises ConfigurationError; do not copy that flag into a
# config whose results will be reported as part of the EIB benchmark.

experiment_id: ablation_attacks_v1
description: "Ablation over all 6 mechanical attack types at poison_rate=0.3, Llama 3.1 8B"
seed: 42

dataset:
  name: json_fixture
  path: eibench_raw_claims.json
  split: test
  max_claims: null

allow_non_benchmark_attacks: true  # includes M03/M05 — see note above

attacks:
  - name: numerical_shift
    poison_rate: 0.3
  - name: attribution_switch
    poison_rate: 0.3
  - name: date_manipulation
    poison_rate: 0.3
    params:
      min_shift: 1
      max_shift: 5
      direction: past
  - name: causal_manipulation
    poison_rate: 0.3
    params:
      inject_count: 1
  - name: cherry_picking
    poison_rate: 0.3
    params:
      omit_count: 1
  - name: missing_context
    poison_rate: 0.3
    params:
      omit_count: 1

retriever:
  type: dense
  embedder: sentence-transformers/all-MiniLM-L6-v2
  vector_store: qdrant
  top_k: 5
  collection_name: eibench_ablation_v1

llm:
  backend: ollama
  model: llama3.1:8b
  temperature: 0.0
  max_tokens: 512

metrics:
  - ffr
  - source_integrity
  - ers

output_dir: results/ablation_attacks_v1/
