# EIBench Poison-Rate Sweep — point 2/5: poison_rate = 0.01 (1%)
# See sweep_0pct.yaml for the full rationale shared by all 5 sweep points.
# All 6 registered attacks (M01-M06) are applied uniformly at the same
# per-attack poison_rate, mirroring experiments/ablation_attacks.yaml's
# multi-attack structure but swept across rate instead of held at 0.3.
#
# Run with: make run CFG=experiments/poison_rate_sweep/sweep_1pct.yaml

experiment_id: poison_sweep_1pct
description: "Poison-rate sweep point 2/5: poison_rate=0.01 (1%), all 6 attacks"
seed: 42

dataset:
  name: snopes
  path: null       # uses SnopesDataset's default: data/snopes/snopes_enriched.json
  split: test
  max_claims: 100

attacks:
  - name: numerical_shift
    poison_rate: 0.01
  - name: date_manipulation
    poison_rate: 0.01
    params:
      min_shift: 1
      max_shift: 5
      direction: past
  - name: attribution_switch
    poison_rate: 0.01
  - name: causal_manipulation
    poison_rate: 0.01
    params:
      inject_count: 1
  - name: cherry_picking
    poison_rate: 0.01
    params:
      omit_count: 1
  - name: missing_context
    poison_rate: 0.01
    params:
      omit_count: 1

retriever:
  type: dense
  embedder: sentence-transformers/all-MiniLM-L6-v2
  vector_store: qdrant
  top_k: 5
  collection_name: eibench_poison_sweep_1pct

llm:
  backend: ollama
  model: llama3.1:8b
  temperature: 0.0
  max_tokens: 512

faithfulness_scorer: embedding  # proxy — see eiger/metrics/README.md; report as "FFR (embedding-similarity proxy)"

metrics:
  - ffr
  - source_integrity
  - ers
  - prr
  - prd

output_dir: results/poison_rate_sweep/1pct/
