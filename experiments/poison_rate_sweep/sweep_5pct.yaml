# EIBench Poison-Rate Sweep — point 4/5: poison_rate = 0.05 (5%)
# See sweep_0pct.yaml for the full rationale shared by all 5 sweep points.
# 5% is the working-hypothesis threshold named in
# docs/CLAIM_AND_RESEARCH_QUESTIONS.md Section 1 ("under 5% of the corpus
# is sufficient") — this point tests right at that boundary.
#
# Run with: make run CFG=experiments/poison_rate_sweep/sweep_5pct.yaml

experiment_id: poison_sweep_5pct
description: "Poison-rate sweep point 4/5: poison_rate=0.05 (5%, working-hypothesis threshold), all 6 attacks"
seed: 42

dataset:
  name: snopes
  path: null       # uses SnopesDataset's default: data/snopes/snopes_enriched.json
  split: test
  max_claims: 100

attacks:
  - name: numerical_shift
    poison_rate: 0.05
  - name: date_manipulation
    poison_rate: 0.05
    params:
      min_shift: 1
      max_shift: 5
      direction: past
  - name: attribution_switch
    poison_rate: 0.05
  - name: causal_manipulation
    poison_rate: 0.05
    params:
      inject_count: 1
  - name: cherry_picking
    poison_rate: 0.05
    params:
      omit_count: 1
  - name: missing_context
    poison_rate: 0.05
    params:
      omit_count: 1

retriever:
  type: dense
  embedder: sentence-transformers/all-MiniLM-L6-v2
  vector_store: qdrant
  top_k: 5
  collection_name: eibench_poison_sweep_5pct

llm:
  backend: ollama
  model: llama3.1:8b
  temperature: 0.0
  max_tokens: 512

faithfulness_scorer: embedding  # proxy — see eiger/metrics/README.md; report as "FFR (embedding-similarity proxy)"

metrics:
  - ffr
  - source_integrity
  - ers
  - prr
  - prd

output_dir: results/poison_rate_sweep/5pct/
