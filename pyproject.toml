[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiger"
version = "0.1.0"
description = "EIBench: Epistemic Integrity Benchmark for RAG systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "EIGER Research Team" }]

dependencies = [
    # Vector store
    "qdrant-client>=1.9.0,<2.0",
    # Embeddings
    "sentence-transformers>=3.0.0,<4.0",
    # NLI for Source Integrity metric (lazily imported — see
    # eiger/metrics/source_integrity.py; falls back to 0.0 if unavailable,
    # but is a real, actually-imported dependency, unlike ragas/rank-bm25
    # below)
    "transformers>=4.40.0,<5.0",
    "torch>=2.2.0",
    # LLM backend (Ollama HTTP API)
    "httpx>=0.27.0,<1.0",
    # Configuration & validation
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "python-dotenv>=1.0.0",
    # Structured logging
    "structlog>=24.1.0",
    # Numerics
    "numpy>=1.26.0,<2.0",
    # CLI experiment config parsing (was only a transitive dependency
    # until Sprint 3's eiger/__main__.py started importing it directly)
    "PyYAML>=6.0,<7.0",
    # BM25 sparse retrieval (eiger/retrieval/sparse_retriever.py, Sprint 4).
    # Moved here from the "future" extra below now that SparseRetriever
    # actually imports it (lazily, inside fit() — see that module's
    # docstring for why the import itself stays deferred).
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-snapshot>=0.9.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
# Only needed for scripts/import_claims_xlsx.py (converting a human-filled
# claim-collection spreadsheet into a JSON claim candidate file). Not a
# core runtime dependency: running experiments never touches .xlsx files.
data-import = [
    "openpyxl>=3.1.0,<4.0",
]
# RAGASFaithfulnessScorer (eiger/metrics/ragas_scorer.py, Sprint 5) — a real,
# LLM-judge-based faithfulness_scorer, opt-in via
# ExperimentConfig.faithfulness_scorer: "ragas".
#
# These exact versions are pinned, not a lower bound with no ceiling: a
# clean `pip install ragas` (latest, 0.4.x, and also 0.3.x) currently fails
# at import time with
#   ModuleNotFoundError: No module named 'langchain_community.chat_models.vertexai'
# because ragas.llms.base unconditionally imports ChatVertexAI from
# langchain-community, which no longer bundles that submodule after its
# 0.4.x "sunset" release. This combination is the one actually verified (by
# importing ragas.metrics.Faithfulness/AnswerCorrectness and
# ragas.llms.LangchainLLMWrapper in a clean virtualenv) to import cleanly —
# see eiger/metrics/ragas_scorer.py's module docstring for the full story.
# Do not relax these pins without re-verifying the import chain first.
ragas = [
    "ragas==0.2.15",
    "langchain-community==0.3.19",
    "langchain-ollama==0.2.3",
]

[project.scripts]
eiger = "eiger.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eiger*"]

# ─── Ruff (linter + formatter) ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

# ─── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# ─── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eiger --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
